name: Build Android Portrait APK (arm64-v8a)

on:
  push:
    branches:
      - godot4-android
  pull_request:
    branches:
      - main
      - godot4-android
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_PLATFORM: "android-34"
  APK_PATH: "build/TwilightOfTheBanyanTree-Portrait-arm64.apk"

jobs:
  build-apk:
    name: Headless Tests & Signed arm64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & apksigner
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools and platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}"

      - name: Install Godot 4.7.2-stable & Export Templates
        run: |
          mkdir -p ~/.local/bin
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -fSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/
          mv "/tmp/Godot_v${GODOT_TAG}_linux.x86_64" ~/.local/bin/godot
          chmod +x ~/.local/bin/godot

          curl -fSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q /tmp/templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/version.txt" -d /tmp/tpl_extract
          mv /tmp/tpl_extract/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf /tmp/godot.zip /tmp/templates.tpz /tmp/tpl_extract

      - name: Generate Personal Debug Keystore & Configure Godot Android Export
        run: |
          mkdir -p ~/.local/share/godot/keystores
          keytool -genkeypair -v \
            -keystore ~/.local/share/godot/keystores/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.7.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = false
          EOF

      - name: Import Godot Resources & Global Script Classes
        run: |
          ~/.local/bin/godot --headless --import

      - name: Run All 6 Headless GDScript Test Suites
        run: |
          ~/.local/bin/godot --headless -s godot/tests/run_tests.gd

      - name: Export Signed Portrait Android APK (arm64-v8a)
        run: |
          mkdir -p build
          ~/.local/bin/godot --headless --export-debug "Android" "${APK_PATH}"
          ls -lh "${APK_PATH}"

      - name: Verify APK Signature with apksigner
        run: |
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "${APK_PATH}"

      - name: Upload Signed Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwilightOfTheBanyanTree-Portrait-arm64
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
